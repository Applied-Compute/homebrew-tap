name: Publish pinned acshift release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-acshift
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and download the reviewed release
        run: python3 scripts/release.py download --output dist
      - name: Publish public binary bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          TAG="acshift-v$VERSION"
          # Never overwrite an existing release or asset. A failed draft stays recoverable.
          gh release create "$TAG" dist/*.tar.gz release.json \
            --draft --target "$GITHUB_SHA" --title "acshift $VERSION" \
            --notes 'Install with `brew install Applied-Compute/tap/acshift`, then run `acshift install`. The bundled CLI build and archive checksums are recorded in release.json.'
          gh release edit "$TAG" --draft=false
